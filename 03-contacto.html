<main class="contact-main">
    <section class="contact-intro">
        <p class="eyebrow">ATENCIÓN PERSONALIZADA</p>
        <h1>Hablemos de tu próximo auto</h1>
        <p>Déjanos tus datos y nuestro equipo se pondrá en contacto contigo.</p>
    </section>

    <section class="formulario-contacto" aria-labelledby="contact-title">
        <h2 id="contact-title">Formulario de contacto</h2>
        <form action="/04-bandejaContacto.html" method="post">
            <div class="contact-fields">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="salida1" autocomplete="given-name"
                        placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="salida2" autocomplete="family-name"
                        placeholder="Tu apellido" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="salida5" autocomplete="email"
                        placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono <span>(opcional)</span></label>
                    <input type="tel" id="telefono" name="telefono" autocomplete="tel"
                        placeholder="+52 55 0000 0000">
                </div>
                <div class="form-group form-group-wide">
                    <label for="mensaje">¿En qué podemos ayudarte?</label>
                    <textarea id="mensaje" name="mensaje" rows="5"
                        placeholder="Cuéntanos qué modelo te interesa o qué información necesitas." required></textarea>
                </div>
            </div>
            <button type="submit" id="button-send">Enviar mensaje</button>
            <p class="form-note">Tus datos se utilizarán únicamente para responder a tu consulta.</p>
        </form>
    </section>
</main>

<footer>Imperial Luxury Cars · Atención personalizada</footer>
