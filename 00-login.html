<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./public/assets/logo-empresa.png">
    <link rel="stylesheet" href="styles-login.css">
    <title>Login</title>

</head>

<body>
    <form action="/01-index.html" method="post" id="form-login">
        <h2> Inicio de sesión</h2>

        <!-- USUARIO -->
        <div class="user-container">
            <label for="nombre"><strong>Usuario:</strong></label>
            <input type="text" id="nombre" name="username" placeholder="Usuario" required>

            <!-- icono del perfil de usuario -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                <path
                    d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5m0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.45 1 1 1m6-7h4c2.76 0 5 2.24 5 5H5c0-2.76 2.24-5 5-5">
                </path>
            </svg>
        </div>


        <!-- Contraseña -->
        <div class="password-container">
            <label for="password"><strong>Contraseña</strong></label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
              


            <!-- icono de la contraseña de usuario -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                <path
                    d="M20 9h-8V7c0-2.76-2.24-5-5-5S2 4.24 2 7h2c0-1.65 1.35-3 3-3s3 1.35 3 3v2H8c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2m-5 11v-2.28c.59-.35 1-.99 1-1.72 0-1.1-.9-2-2-2s-2 .9-2 2a2 2 0 0 0 1 1.72V20H8v-9h12v9z">
                </path>
            </svg>
        </div>


        <!--Botón para ingresar -->
        <button type="submit" id="login-button">Login</button>
        <div class="remember-password"><a href="#">¿Olvidaste tu contraseña?</a></div>


        <div class="new-account">
            <p class="register-link">¿Todavía no tienes una cuenta?</p><a href="#">Regístrate</a>
        </div>
    </form>
</body>

</html>
